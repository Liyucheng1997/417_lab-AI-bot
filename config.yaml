# 我的 AI Bot 配置（修改后重启生效；面板里的模型/权限切换会写回本文件）

# 模型：claude-opus-5-5 / claude-sonnet-5-5 / claude-haiku-5-5
model: claude-opus-5-5
# 思考深度：low / medium / high / xhigh / max
effort: high

# 权限策略：
#   smart  —— 读取、截图、鼠标键盘等直接执行；删除文件、改注册表、关机、安装卸载等高危操作先弹窗确认（推荐）
#   full   —— 全部自动执行，不询问
#   strict —— 除只读操作外，每一步都要确认
permission_policy: smart

# 呼出/隐藏面板的全局快捷键（ctrl+alt+space 已被 Claude 桌面版占用）
hotkey: ctrl+alt+b

# 文件搜索（标题栏的放大镜）：只索引文档、图片、视频、音乐、压缩包、快捷方式，不管系统和程序文件。
#   search_hotkey：直接呼出搜索的快捷键（留空 = 不用快捷键）
#   search_exclude：不想被搜到的文件夹，例如 ['D:\私人', 'E:\备份']
#   search_extensions：额外要索引的扩展名，例如 ["py", "html"]
search_hotkey: ctrl+alt+f
search_exclude: []
search_extensions: []

# Bot 的工作目录（留空 = 项目里的 workspace 文件夹，对话历史也按这个目录保存；
# Bot 依然可以访问整台电脑的文件）
cwd: ""

# 面板宽度（像素）
panel_width: 460

# 停靠方式：auto —— 鼠标离开就滑到屏幕右边缘，碰一下右边缘再滑出来；pinned —— 一直显示（面板上的图钉按钮可切换）
dock: auto

# 欢迎页怎么称呼你（留空就只说「早上好」）
nickname: ""

# 欢迎页的快捷请求由 AI 根据你最近的对话和记忆来猜（Haiku，很省额度）；false = 用固定的几条
smart_suggestions: true

# 启动时自动检查新版本（也可以在面板设置里手动「检查更新」）
check_updates: true

# API 额度（赠送或预付的 credits）：用量面板按「额度 − 开始日期以来的花费」算剩余和到期天数；留空 = 不显示
#   amount: 金额（美元）  start / end: 有效期（含首尾两天）
# api_credit:
#   amount: 100
#   start: 2026-10-29
#   end: 2026-12-02
api_credit: {}

# 外观（面板「设置 → 墨迹颜色与形象大小」里可以直接调）：背景墨迹颜色、浓淡（0 = 关闭）、3D 形象高度（像素）
fluid_color: "#af52de"
fluid_opacity: 0.8
avatar_size: 180

# 屏幕顶部正中的灵动岛（液态玻璃）：Bot 干活的进度、正在播放的音乐、快捷入口。设置菜单里也能开关
island: true

# 手机投屏（面板标题栏的「手机」按钮；这些在那个页面的设置里也能改）
#   phone_audio：手机声音从电脑播放    phone_screen_off：投屏时手机自己熄屏（省电、防偷看，电脑上照常操作）
#   phone_on_top：投屏窗口置顶          phone_max_size：画面最长边像素（0 = 原画，卡的话改 1280 或 1024）
#   phone_keyboard：sdk = 电脑键盘直接打英文、中文用 Ctrl+V 粘贴；uhid = 当成手机的实体键盘，用手机自己的输入法打中文
phone_audio: true
phone_screen_off: false
phone_on_top: false
phone_max_size: 0
phone_keyboard: sdk

# 是否加载你在 Claude Code 里配置的 MCP 服务器、技能和插件（~/.claude）
load_user_settings: true

# 额外的 MCP 服务器（格式同 Claude Code 的 mcpServers），例如：
# extra_mcp_servers:
#   filesystem:
#     command: npx
#     args: ["-y", "@modelcontextprotocol/server-filesystem", "D:/"]
extra_mcp_servers: {}
